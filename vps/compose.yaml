# laya-serve for the LayaPHP projects, tuned for an 8 vCPU / 24 GB RAM VPS without a GPU.
#
#   cp .env.example .env              # then set LAYA_API_KEY
#   docker compose up -d --wait       # first build + model download takes 10-20 minutes
#   curl -s http://127.0.0.1:8000/health
#
# Built from upstream's Dockerfile (CPU torch) at a pinned commit: laya 0.3.23, the same commit
# marcreichel/laya-php runs its integration tests against. Bump it deliberately, then re-run
# the projects' evaluations, because a new model can classify the same text differently.
name: laya

services:
  laya-serve:
    build:
      context: https://github.com/NandhaKishorM/laya.git#d8a2e59781ca135169a36095056132e273cd9938
    command: ["laya-serve"]
    restart: unless-stopped
    ports:
      # Loopback only: PHP on this VPS can reach it, the internet cannot.
      - "127.0.0.1:${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_DEVICE: cpu
      # Keep all three checkpoints resident (24 GB RAM is plenty), so no request pays a cold load.
      LAYA_PRELOAD: "${LAYA_PRELOAD:-1}"
      LAYA_MODELS: "${LAYA_MODELS:-}"
      # "reviewed" pins the checkpoints to the SHAs laya has reviewed: rebuilds give the same answers.
      LAYA_REVISION: "${LAYA_REVISION:-reviewed}"
      LAYA_DEFAULT_MODEL: "${LAYA_DEFAULT_MODEL:-}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      LAYA_MAX_CONCURRENT: "${LAYA_MAX_CONCURRENT:-16}"
      # Leave 2 of the 8 vCPUs for PHP, queue workers and the OS.
      LAYA_THREADS: "${LAYA_THREADS:-6}"
      OMP_NUM_THREADS: "${LAYA_THREADS:-6}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      start_period: 20m
      start_interval: 5s

volumes:
  model-cache:
